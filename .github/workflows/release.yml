# Builds FastBet installers on GitHub's machines.
#
# Push a tag like v3.1.0 and this builds Windows, Linux and macOS installers and puts
# them on a GitHub Release (the app version is taken from the tag).
# "Run workflow" on the Actions tab builds the same files without a release;
# they show up as downloads at the bottom of the run page.

name: Build installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash
    working-directory: fastbet-rs

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            formats: nsis
            # bake the C runtime into the exe so it runs on PCs without the VC++ redistributable
            rustflags: -C target-feature=+crt-static
          - name: Linux
            # oldest supported Ubuntu, so the AppImage runs on older distros too
            os: ubuntu-22.04
            formats: deb,appimage
            rustflags: ""
          - name: macOS-AppleSilicon
            os: macos-latest
            formats: app
            rustflags: ""
          - name: macOS-Intel
            os: macos-15-intel
            formats: app
            rustflags: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: perl -0pi -e "s/^version = .*/version = \"${GITHUB_REF_NAME#v}\"/m" Cargo.toml

      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libasound2-dev librsvg2-dev patchelf libfuse2 file squashfs-tools

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92.0"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fastbet-rs

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-packager

      - name: Build
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build --release

      - name: Package
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: cargo packager --release --formats ${{ matrix.formats }}

      # Ubuntu 22.04's libxkbcommon can't read the keymaps of newer Wayland
      # desktops (KDE on CachyOS), which made the app crash on the first key press.
      # Its libwayland is too old for the Mesa of Arch-based distros, which then
      # can't load: the login window stayed blank there.
      - name: Use the system's keyboard and Wayland libraries in the AppImage
        if: runner.os == 'Linux'
        run: >-
          bash packaging/appimage-drop-libs.sh "$(find target/release -maxdepth 3 -type f -name '*.AppImage' | head -1)"
          libxkbcommon.so.0 libwayland-client.so.0 libwayland-cursor.so.0 libwayland-egl.so.1 libwayland-server.so.0

      # No Apple developer certificate: with an ad-hoc signature macOS offers "Open Anyway"
      # instead of calling the downloaded app damaged.
      - name: Sign the Mac app and pack it into a .dmg
        if: runner.os == 'macOS'
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          app=$(find target/release -maxdepth 3 -type d -name 'FastBet.app' | head -1)
          codesign --force --deep --sign - "$app"
          mkdir dmg-root
          cp -R "$app" dmg-root/
          ln -s /Applications dmg-root/Applications
          # hdiutil sometimes answers "Resource busy" on GitHub's Macs
          for try in 1 2 3 4 5; do
            hdiutil create -volname FastBet -srcfolder dmg-root -ov -format UDZO "target/release/FastBet_${version}_$(uname -m).dmg" && break
            sleep 10
          done

      - name: Collect files
        run: |
          mkdir -p dist
          find target/release -maxdepth 3 -type f \( -name '*-setup.exe' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.dmg' \) -exec cp {} dist/ \;
          if [ "$RUNNER_OS" = "Windows" ]; then
            version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
            cp target/release/fastbet.exe "dist/FastBet_${version}_x64-portable.exe"
          fi
          ls -la dist

      - uses: actions/upload-artifact@v7
        with:
          name: FastBet-${{ matrix.name }}
          path: fastbet-rs/dist/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      # the notes are the release commit's bullets ("FastBet X.Y.Z: title" + "- " lines)
      - name: Release notes
        run: git log -1 --format=%b HEAD | grep -vi '^co-authored-by:' > notes.md; cat notes.md

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        continue-on-error: true
        with:
          files: dist/*
          body_path: notes.md

      # GitHub's API sometimes answers 500 while publishing (v3.22.0 stayed a draft that way): make
      # sure the release exists, has every file and isn't a draft, trying for a few minutes
      - name: Make sure the release is out
        run: |
          for try in 1 2 3 4 5 6; do
            if ! gh release view "$TAG" >/dev/null 2>&1; then
              gh release create "$TAG" dist/* --title "$TAG" --notes-file notes.md --verify-tag || true
            else
              have=$(gh release view "$TAG" --json assets -q '.assets[].name')
              for f in dist/*; do
                grep -qxF "$(basename "$f")" <<< "$have" || gh release upload "$TAG" "$f" --clobber || true
              done
              gh release edit "$TAG" --draft=false --notes-file notes.md || true
            fi
            draft=$(gh release view "$TAG" --json isDraft -q .isDraft 2>/dev/null || echo missing)
            count=$(gh release view "$TAG" --json assets -q '.assets | length' 2>/dev/null || echo 0)
            echo "try $try: draft=$draft files=$count of $(ls dist | wc -l)"
            if [ "$draft" = "false" ] && [ "$count" -ge "$(ls dist | wc -l)" ]; then exit 0; fi
            sleep $((try * 20))
          done
          echo "::error::The release is still not published"
          exit 1
